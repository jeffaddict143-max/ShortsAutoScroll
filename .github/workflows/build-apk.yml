name: Build Shorts Auto Scroll APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: unzip -o ShortsAutoScroll-with-Cloud-Build.zip -d .

      - name: Fix Accessibility Timer Loop
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/com/example/shortsautoscroll/AutoScrollAccessibilityService.kt")
          s = p.read_text()

          old = "            if (!isEnabled()) return\n"
          new = """            if (!isEnabled()) {
                          handler.postDelayed(this, 1000L)
                          return
                      }
          """

          if old not in s:
              raise SystemExit("Expected code not found. Build stopped safely.")

          s = s.replace(old, new, 1)
          p.write_text(s)
          print("Accessibility timer loop fixed.")
          PY

      - name: Fix Java Kotlin compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          if "compileOptions {" not in s:
              s = s.replace("android {", """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """, 1)
          else:
              s = re.sub(
                  r"sourceCompatibility\s*=\s*JavaVersion\.VERSION_\d+",
                  "sourceCompatibility = JavaVersion.VERSION_17", s
              )
              s = re.sub(
                  r"targetCompatibility\s*=\s*JavaVersion\.VERSION_\d+",
                  "targetCompatibility = JavaVersion.VERSION_17", s
              )

          p.write_text(s)
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Inspect App Permissions
        run: |
          echo "===== ANDROID MANIFEST ====="
          cat app/src/main/AndroidManifest.xml

          echo "===== ACCESSIBILITY SERVICE ====="
          cat app/src/main/java/com/example/shortsautoscroll/AutoScrollAccessibilityService.kt

          echo "===== MAIN ACTIVITY ====="
          cat app/src/main/java/com/example/shortsautoscroll/MainActivity.kt

          echo "===== ACCESSIBILITY CONFIG ====="
          cat app/src/main/res/xml/accessibility_service_config.xml

          echo "===== APP GRADLE ====="
          cat app/build.gradle.kts

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShortsAutoScroll-APK
          path: app/build/outputs/apk/debug/app-debug.apk
