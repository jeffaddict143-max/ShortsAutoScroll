name: Build Shorts Auto Scroll APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: unzip -o ShortsAutoScroll-with-Cloud-Build.zip -d .
        
      - name: Show MainActivity Source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/com/example/shortsautoscroll/MainActivity.kt")
          print("===== MAIN ACTIVITY SOURCE =====")
          print(p.read_text())
          print("===== END SOURCE =====")
          PY

      - name: Show Android Manifest Source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/AndroidManifest.xml")
          print("===== ANDROID MANIFEST SOURCE =====")
          print(p.read_text())
          print("===== END MANIFEST SOURCE =====")
          PY
          
      - name: Fix Accessibility Timer Loop
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/com/example/shortsautoscroll/AutoScrollAccessibilityService.kt")
          s = p.read_text()

          old = "            if (!isEnabled()) return\n"
          new = """            if (!isEnabled()) {
                          handler.postDelayed(this, 1000L)
                          return
                      }
          """

          if old not in s:
              raise SystemExit("Expected code not found. Build stopped safely.")

          s = s.replace(old, new, 1)
          p.write_text(s)
          print("Accessibility timer loop fixed.")
          PY

      - name: Add Next and Previous Swipe Modes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          base = Path("app/src/main/java/com/example/shortsautoscroll")

          p = base / "MainActivity.kt"
          s = p.read_text()

          old = '''        root.addView(interval)

                  addText("3. Enable the controller", 18f, true)'''

          new = '''        root.addView(interval)

                  addText("3. Swipe direction", 18f, true)
                  val direction = Spinner(this)
                  direction.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item,
                      listOf("Next Short (swipe up)", "Previous Short (swipe down)"))
                  direction.setSelection(if (prefs.getString("direction", "next") == "previous") 1 else 0)
                  root.addView(direction)

                  addText("4. Enable the controller", 18f, true)'''

          if old not in s:
              raise SystemExit("MainActivity UI anchor not found.")

          s = s.replace(old, new, 1)

          old_save = 'prefs.edit().putString("mode", selectedMode).putInt("interval", seconds).apply()'
          new_save = '''val selectedDirection = if (direction.selectedItemPosition == 1) "previous" else "next"
                      prefs.edit().putString("mode", selectedMode).putInt("interval", seconds).putString("direction", selectedDirection).apply()'''

          if s.count(old_save) < 1:
              raise SystemExit("Settings save anchor not found.")

          s = s.replace(old_save, new_save)
          p.write_text(s)

          p = base / "AutoScrollAccessibilityService.kt"
          s = p.read_text()

          old_swipe = '''        val startY = dm.heightPixels * 0.78f
                  val endY = dm.heightPixels * 0.25f'''

          new_swipe = '''        val previous = getSharedPreferences("shorts_auto", MODE_PRIVATE)
                  .getString("direction", "next") == "previous"
                  val startY = dm.heightPixels * (if (previous) 0.25f else 0.78f)
                  val endY = dm.heightPixels * (if (previous) 0.78f else 0.25f)'''

          if old_swipe not in s:
              raise SystemExit("Swipe direction anchor not found.")

          s = s.replace(old_swipe, new_swipe, 1)
          p.write_text(s)

          print("Next and Previous modes added successfully.")
          PY


      - name: Remove Smart Mode Timer Fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/src/main/java/com/example/shortsautoscroll/AutoScrollAccessibilityService.kt")
          s = p.read_text()

          pattern = r'(?m)^\s*// Fallback if no usable progress bar is exposed by YouTube\.\n\s*if \(now - lastSwipeAt >= intervalMs && smartCandidateSince == 0L\) swipeNext\(\)\s*$'

          s, count = re.subn(pattern, '// Smart mode waits for detected video progress.', s)

          if count != 1:
              raise SystemExit(f"Expected 1 fallback line, found {count}. No changes applied.")

          p.write_text(s)
          print("Smart mode timer fallback removed.")
          PY
      
      - name: Improve Smart Progress Detection
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/com/example/shortsautoscroll/AutoScrollAccessibilityService.kt")
          s = p.read_text()

          start = s.find("    private fun findNearEndProgress(node: AccessibilityNodeInfo): Float? {")
          end = s.find("    private fun isEnabled(): Boolean =", start)

          if start < 0 or end < 0:
              raise SystemExit("Could not locate progress detection function.")

          new_function = r'''    private fun findNearEndProgress(node: AccessibilityNodeInfo): Float? {
                  val range = node.rangeInfo
                  if (range != null && range.max > range.min) {
                      val fraction = ((range.current - range.min) /
                          (range.max - range.min)).coerceIn(0f, 1f)
                      return fraction
                  }

                  val desc = (
                      (node.contentDescription?.toString() ?: "") + " " +
                      (node.text?.toString() ?: "")
                  )

                  val timeMatch = Regex(
                      """(\d{1,2}):(\d{2})\s*(?:/|of)\s*(\d{1,2}):(\d{2})""",
                      RegexOption.IGNORE_CASE
                  ).find(desc)

                  if (timeMatch != null) {
                      val v = timeMatch.groupValues
                      val current = v[1].toInt() * 60 + v[2].toInt()
                      val total = v[3].toInt() * 60 + v[4].toInt()
                      if (total > 0) return (current.toFloat() / total).coerceIn(0f, 1f)
                  }

                  for (i in 0 until node.childCount) {
                      val child = node.getChild(i) ?: continue
                      val found = findNearEndProgress(child)
                      child.recycle()
                      if (found != null) return found
                  }

                  return null
              }

          '''

          s = s[:start] + new_function + s[end:]
          p.write_text(s)
          print("Smart progress detection improved.")
          PY

      - name: Fix Java Kotlin compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          if "compileOptions {" not in s:
              s = s.replace("android {", """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """, 1)
          else:
              s = re.sub(
                  r"sourceCompatibility\s*=\s*JavaVersion\.VERSION_\d+",
                  "sourceCompatibility = JavaVersion.VERSION_17", s
              )
              s = re.sub(
                  r"targetCompatibility\s*=\s*JavaVersion\.VERSION_\d+",
                  "targetCompatibility = JavaVersion.VERSION_17", s
              )

          p.write_text(s)
          PY

      - name: Show Accessibility Service Source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/com/example/shortsautoscroll/AutoScrollAccessibilityService.kt")
          print("===== ACCESSIBILITY SERVICE SOURCE =====")
          print(p.read_text())
          print("===== END ACCESSIBILITY SOURCE =====")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Inspect App Permissions
        run: |
          echo "===== ANDROID MANIFEST ====="
          cat app/src/main/AndroidManifest.xml

          echo "===== ACCESSIBILITY SERVICE ====="
          cat app/src/main/java/com/example/shortsautoscroll/AutoScrollAccessibilityService.kt

          echo "===== MAIN ACTIVITY ====="
          cat app/src/main/java/com/example/shortsautoscroll/MainActivity.kt

          echo "===== ACCESSIBILITY CONFIG ====="
          cat app/src/main/res/xml/accessibility_service_config.xml

          echo "===== APP GRADLE ====="
          cat app/build.gradle.kts

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShortsAutoScroll-APK
          path: app/build/outputs/apk/debug/app-debug.apk
